# Render IaC blueprint — Bulwark background worker (E11-S9 / ADR-0012).
#
# Provisions a single Node Background Worker that runs the pg-boss
# subscriber loop in `server/jobs/worker.ts`. The web tier lives on
# Vercel; this worker handles compliance-doc PDF rendering (Puppeteer +
# Chromium → R2 upload → signed URL) and any future async jobs.
#
# # First deploy
#   1. Push this repo to GitHub.
#   2. In Render, "New" → "Blueprint" → connect the repo. Render reads
#      this file and offers to create the service.
#   3. Render will prompt for the secret env vars listed under
#      `envVars` with `sync: false` (DATABASE_URL, R2_*).
#      Use the same Neon URL + R2 creds the Vercel project uses.
#   4. Confirm. The service builds, runs `pnpm install` (which fetches
#      Chromium for Puppeteer), then starts the worker.
#
# # Scaling
#   - Plan starts at `starter` (512 MB / 0.5 CPU). Compliance PDFs use
#     ~250 MB peak per render; bump to `standard` if we see EAGAIN /
#     SIGABRT on Chromium launch.
#   - `numInstances: 1` is intentional — pg-boss handles single-leader
#     fan-out from the queue; we don't need multiple subscribers yet.
#
# # Decision cast down
#   - Running the worker on Vercel via cron + serverless. Rejected:
#     Vercel functions cap at 300s and can't keep a long-lived
#     subscription open. pg-boss needs a persistent process.
services:
  - type: worker
    name: bulwark-worker
    runtime: node
    plan: starter
    region: oregon  # us-west — colocated with Neon us-west-2 + Vercel pdx1.
    branch: main
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm run worker:jobs
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BULWARK_BACKEND
        value: real
      - key: BULWARK_PDF_STUB
        value: "0"
      # --- Secrets (Render prompts for these on first deploy) -----------
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      # Optional — leave blank if R2 bucket is private (worker uses
      # signed URLs). Set if you front R2 with a public CDN later.
      - key: R2_PUBLIC_URL
        sync: false

  # --- Scheduled jobs (L05-S2 / ADR-0005) ---------------------------------
  # Render Cron curls the guarded trigger endpoints on the Vercel web tier;
  # the endpoint enqueues the JobKind and the worker above executes it.
  # BULWARK_CRON_SECRET must be set BOTH here and on the Vercel project
  # (the endpoint compares it constant-time; unset = bearer path disabled).
  # BULWARK_APP_URL is the production web origin, e.g. https://app.bulwark.example
  - type: cron
    name: bulwark-cron-account-purge
    runtime: node
    plan: starter
    region: oregon
    branch: main
    schedule: '0 2 * * *' # daily 02:00 UTC — GDPR 30-day purge sweep
    buildCommand: 'true'
    startCommand: >-
      curl -sf -X POST "$BULWARK_APP_URL/api/admin/jobs/account-purge"
      -H "Authorization: Bearer $BULWARK_CRON_SECRET"
    envVars:
      - key: BULWARK_APP_URL
        sync: false
      - key: BULWARK_CRON_SECRET
        sync: false

  - type: cron
    name: bulwark-cron-coi-expiry-scan
    runtime: node
    plan: starter
    region: oregon
    branch: main
    schedule: '0 3 * * *' # nightly 03:00 UTC — all-orgs COI expiry sweep
    buildCommand: 'true'
    startCommand: >-
      curl -sf -X POST "$BULWARK_APP_URL/api/admin/jobs/coi-expiry-scan"
      -H "Authorization: Bearer $BULWARK_CRON_SECRET"
    envVars:
      - key: BULWARK_APP_URL
        sync: false
      - key: BULWARK_CRON_SECRET
        sync: false
