<?xml version="1.0" encoding="UTF-8"?>
<!--
  sprite.svg — Bulwark icon set (W2-6 / EH-L).

  Strategy
  --------
  A single SVG sprite is used over @nuxt/icon / lucide-vue-next because:
    1. Zero JS runtime cost — the sprite is a static asset.
    2. No new dep on Iconify (which ships an extra runtime + chunk in
       prod). Phase 1 is shipping light; we want the smallest footprint.
    3. We control the symbol IDs, so renames don't ripple through page
       templates the way an iconify rename would.
  All glyphs are 24×24 outline strokes (stroke-width 2, round caps),
  visually matching the Lucide family that the wireframes / boilerplate
  reference. They are intentionally monochrome — color comes from the
  parent via `stroke="currentColor"`.

  Authoring rules
  ---------------
    - viewBox=0 0 24 24 on every <symbol>; never set width/height.
    - stroke=currentColor (inherits from text-color); never fill.
    - Round caps / round joins; stroke-width 2.
    - Add new icons here (alphabetical inside the file). Then add the
      name to `ICON_NAMES` in BulwarkIcon.vue so the unit test catches
      typos at consume sites.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <g id="bw-base" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </defs>

  <symbol id="bw-alert-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>

