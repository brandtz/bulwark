# Bulwark CI — typecheck, lint, unit tests, Playwright E2E
#
# Decisions (ADR-0007 / ADR-0010):
#   - Every push and PR runs the full battery. There is no "merge with red CI."
#   - Playwright runs in headless mode against the mock backend (BULWARK_BACKEND=mock).
#   - We pin pnpm + Node versions for reproducibility.
#
# Decisions NOT taken:
#   - The `e2e` job runs the mock backend; `screens` and `e2e-real` (WP-Q3) run a real
#     Postgres service against the built server.
#   - We do NOT split jobs across runners yet — single-runner is fine through
#     E10. Sharding added when E2E runtime exceeds ~5 minutes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BULWARK_BACKEND: mock
  NUXT_SESSION_PASSWORD: ci-only-32char-min-fixed-string-aaaaaaaaa

jobs:
  quality:
    name: typecheck + lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nuxt prepare (.nuxt types)
        run: pnpm exec nuxt prepare

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mock lane: chromium only. Running every project in mock mode exceeded the
      # job timeout on every push (cancelled at 30 min since at least 8c48aa1);
      # e2e-real covers the suite against the real backend.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # WP-Q1: screen-contract harness self-tests (scaffold/audit rejection, design
  # baseline self-vs-blank, axe contrast fixture, eight-role authorization) against
  # a real Postgres and the built server. Per-screen specs join this project as
  # their SCR work packages land.
  screens:
    name: screen-contract harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bulwark
          POSTGRES_PASSWORD: bulwark
          POSTGRES_DB: bulwark_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bulwark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BULWARK_BACKEND: real
      DATABASE_URL: postgres://bulwark:bulwark@localhost:5432/bulwark_ci
      JWT_SECRET: ci-only-jwt-secret-32char-min-aaaaaaaaaa
      BULWARK_PDF_STUB: '1'
      BULWARK_E2E_SERVER_COMMAND: node .output/server/index.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm exec drizzle-kit migrate

      - name: Build app
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run screen-contract harness
        run: pnpm exec playwright test tests/e2e/screens/_harness.spec.ts --project=screens --reporter=list,html

      - name: Upload screen-contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-report
          path: playwright-report/
          retention-days: 14

  # WP-Q3: the full chromium suite against the REAL backend (seeded Postgres) and the
  # built server — the mock-mode `e2e` job above cannot catch service/SQL/SSR
  # regressions. A production build always uses the r2 storage driver, so moto's S3
  # server stands in for R2 (path-style addressing; it answers CORS preflights for any
  # origin, which the browser PUT to the presigned URL needs).
  e2e-real:
    name: playwright e2e (real backend, built)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bulwark
          POSTGRES_PASSWORD: bulwark
          POSTGRES_DB: bulwark_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bulwark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BULWARK_BACKEND: real
      DATABASE_URL: postgres://bulwark:bulwark@localhost:5432/bulwark_ci
      JWT_SECRET: ci-only-jwt-secret-32char-min-aaaaaaaaaa
      BULWARK_PDF_STUB: '1'
      BULWARK_E2E_SERVER_COMMAND: node .output/server/index.mjs
      BULWARK_PLATFORM_ADMIN_EMAILS: sasha@bulwark.platform
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: bulwarkci
      R2_SECRET_ACCESS_KEY: bulwarkci-secret
      R2_BUCKET: bulwark-ci
      R2_ENDPOINT: http://localhost:9000
      R2_FORCE_PATH_STYLE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runner system Python is externally managed (PEP 668), so pip needs its own interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start S3 stand-in for R2 (moto)
        run: |
          python -m pip install --quiet "moto[server]==5.2.3"
          nohup python -m moto.server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:9000/ || { cat moto.log; exit 1; }
          node -e "const {S3Client,CreateBucketCommand}=require('@aws-sdk/client-s3');new S3Client({region:'auto',endpoint:process.env.R2_ENDPOINT,forcePathStyle:true,credentials:{accessKeyId:process.env.R2_ACCESS_KEY_ID,secretAccessKey:process.env.R2_SECRET_ACCESS_KEY}}).send(new CreateBucketCommand({Bucket:process.env.R2_BUCKET})).then(()=>console.log('bucket ready'))"

      - name: Migrate + seed database
        run: |
          pnpm exec drizzle-kit migrate
          pnpm db:seed

      - name: Build app
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-backend chromium suite
        run: pnpm exec playwright test --project=chromium --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: playwright-report/
          retention-days: 14

  # WP-L08 (epic L10-S1): Lighthouse budgets on the ten busiest signed-in routes
  # (lighthouserc.cjs). Same built server + seeded Postgres as e2e-real.
  lighthouse:
    name: lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bulwark
          POSTGRES_PASSWORD: bulwark
          POSTGRES_DB: bulwark_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bulwark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BULWARK_BACKEND: real
      NUXT_PUBLIC_BACKEND: real
      DATABASE_URL: postgres://bulwark:bulwark@localhost:5432/bulwark_ci
      JWT_SECRET: ci-only-jwt-secret-32char-min-aaaaaaaaaa
      NUXT_SESSION_COOKIE_SECURE: 'false'
      BULWARK_RATE_LIMIT_DISABLED: '1'
      BULWARK_PDF_STUB: '1'
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate + seed database
        run: |
          pnpm exec drizzle-kit migrate
          pnpm db:seed

      - name: Build app
        run: pnpm build

      - name: Start built server
        run: |
          nohup node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/api/health && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/api/health || { cat server.log; exit 1; }

      - name: Run Lighthouse CI
        run: |
          export LHCI_COOKIE="$(node scripts/perf/lhci-session.mjs)"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
