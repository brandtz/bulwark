# Bulwark CI — typecheck, lint, unit tests, Playwright E2E
#
# Decisions (ADR-0007 / ADR-0010):
#   - Every push and PR runs the full battery. There is no "merge with red CI."
#   - Playwright runs in headless mode against the mock backend (BULWARK_BACKEND=mock).
#   - We pin pnpm + Node versions for reproducibility.
#
# Decisions NOT taken:
#   - We do NOT run against a real Postgres yet. E11 introduces a Neon branch
#     per PR; a `db:` job will be added then.
#   - We do NOT split jobs across runners yet — single-runner is fine through
#     E10. Sharding added when E2E runtime exceeds ~5 minutes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BULWARK_BACKEND: mock
  NUXT_SESSION_PASSWORD: ci-only-32char-min-fixed-string-aaaaaaaaa

jobs:
  quality:
    name: typecheck + lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nuxt prepare (.nuxt types)
        run: pnpm exec nuxt prepare

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
