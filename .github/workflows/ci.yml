# Bulwark CI — typecheck, lint, unit tests, Playwright E2E
#
# Decisions (ADR-0007 / ADR-0010):
#   - Every push and PR runs the full battery. There is no "merge with red CI."
#   - Playwright runs in headless mode against the mock backend (BULWARK_BACKEND=mock).
#   - We pin pnpm + Node versions for reproducibility.
#
# Decisions NOT taken:
#   - We do NOT run against a real Postgres yet. E11 introduces a Neon branch
#     per PR; a `db:` job will be added then.
#   - We do NOT split jobs across runners yet — single-runner is fine through
#     E10. Sharding added when E2E runtime exceeds ~5 minutes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BULWARK_BACKEND: mock
  NUXT_SESSION_PASSWORD: ci-only-32char-min-fixed-string-aaaaaaaaa

jobs:
  quality:
    name: typecheck + lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nuxt prepare (.nuxt types)
        run: pnpm exec nuxt prepare

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # WP-Q1: screen-contract harness self-tests (scaffold/audit rejection, design
  # baseline self-vs-blank, axe contrast fixture, eight-role authorization) against
  # a real Postgres and the built server. Per-screen specs join this project as
  # their SCR work packages land.
  screens:
    name: screen-contract harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bulwark
          POSTGRES_PASSWORD: bulwark
          POSTGRES_DB: bulwark_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bulwark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BULWARK_BACKEND: real
      DATABASE_URL: postgres://bulwark:bulwark@localhost:5432/bulwark_ci
      JWT_SECRET: ci-only-jwt-secret-32char-min-aaaaaaaaaa
      BULWARK_PDF_STUB: '1'
      BULWARK_E2E_SERVER_COMMAND: node .output/server/index.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm exec drizzle-kit migrate

      - name: Build app
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run screen-contract harness
        run: pnpm exec playwright test tests/e2e/screens/_harness.spec.ts --project=screens --reporter=list,html

      - name: Upload screen-contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-report
          path: playwright-report/
          retention-days: 14
